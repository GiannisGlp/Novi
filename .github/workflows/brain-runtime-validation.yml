name: Brain Runtime Validation

on:
  push:
    branches: [main]
    paths:
      - 'novi/**'
      - 'docs/02-novi-brain/**'
      - '.github/workflows/brain-runtime-validation.yml'
  pull_request:
    paths:
      - 'novi/**'
      - 'docs/02-novi-brain/**'
      - '.github/workflows/brain-runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check novi

      - name: Verify Python test discovery
        run: |
          python --version
          python -m unittest discover -s novi/brain/tests -p 'test_*.py' -v

      - name: Run Brain test suite again as CI gate
        run: python -m unittest discover -s novi/brain/tests -p 'test_*.py'

      - name: Run Brain deterministic runtime smoke test
        run: python -m novi.brain.cli --cycles 1

      - name: Upload Brain smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-smoke-evidence
          path: brain_evidence.json
          if-no-files-found: ignore
