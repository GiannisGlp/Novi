name: Brain Runtime Validation

on:
  push:
    branches: [main]
    paths:
      - 'brain/**'
      - 'MAC_BRAIN/**'
      - 'docs/02-novi-brain/**'
      - '.github/workflows/brain-runtime-validation.yml'
  pull_request:
    paths:
      - 'brain/**'
      - 'MAC_BRAIN/**'
      - 'docs/02-novi-brain/**'
      - '.github/workflows/brain-runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python test discovery
        run: |
          python --version
          python -m unittest discover -s brain/tests -p 'test_*.py' -v

      - name: Run Brain test suite again as CI gate
        run: python -m unittest discover -s brain/tests -p 'test_*.py'

      - name: Run Mac Brain integration tests
        run: python -m unittest discover -s MAC_BRAIN/tests -p 'test_*.py' -v

      - name: Run Mac Brain deterministic runtime smoke test
        run: python -m MAC_BRAIN.cli --deterministic --cycles 1

      - name: Upload Mac Brain smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-brain-smoke-evidence
          path: MAC_BRAIN_evidence.json
          if-no-files-found: ignore
