<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novi — Mac Brain</title>
<style>
  :root { --bg:#0b0e14; --panel:#12161f; --border:#232a36; --text:#d7dee8; --dim:#7d8a9a;
          --accent:#4cc2ff; --good:#3fd07f; --warn:#f2c14e; --bad:#ff6b6b; --green:#3fd07f;
          --user-bg:#12314a; --novi-bg:#161d2a; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; color:var(--text);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; flex-direction:column; overflow:hidden;
         background:radial-gradient(1200px 600px at 20% -10%, #101a2b 0%, var(--bg) 55%); }
  header { display:flex; align-items:center; gap:14px; padding:12px 22px;
           border-bottom:1px solid var(--border);
           background:linear-gradient(180deg, rgba(255,255,255,.02), transparent); flex:0 0 auto; }
  header h1 { margin:0; font-size:17px; letter-spacing:2px; color:#fff; font-weight:700; }
  .logo { display:flex; align-items:center; gap:9px; animation:glow 3s ease-in-out infinite; }
  .logo .dot { width:11px; height:11px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); }
  @keyframes glow { 0%,100%{box-shadow:0 0 4px var(--green);} 50%{box-shadow:0 0 14px var(--green);} }
  .badge { font-size:12px; color:var(--dim); }
  #health { padding:2px 8px; border:1px solid var(--border); border-radius:4px; }

  .nav { display:flex; gap:6px; margin-left:18px; }
  .nav button { background:transparent; border:1px solid transparent; color:var(--dim);
                padding:6px 12px; border-radius:999px; cursor:pointer; font:inherit; font-size:13px; }
  .nav button:hover { color:var(--text); }
  .nav button.active { color:var(--accent); border-color:var(--accent); background:#10202f; }

  .modelwrap { margin-left:auto; display:flex; align-items:center; gap:8px; }
  #modelSelect { background:#1a2130; color:var(--text); border:1px solid var(--border);
                 border-radius:4px; padding:4px 8px; font:inherit; font-size:12px; }

  .page { flex:1 1 auto; min-height:0; display:none; }
  .page.active { display:flex; }

  /* ---------- CHAT PAGE (full window) ---------- */
  #page-chat { flex-direction:column; }
  .chatbody { flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:none;
              display:flex; flex-direction:column; gap:12px; padding:20px 24px; }
  .chatbody::-webkit-scrollbar { display:none; }
  .empty { margin:auto; color:var(--dim); text-align:center; }
  .empty .ring { font-size:26px; animation:spin 2.4s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .turn { max-width:min(72%,620px); display:flex; gap:10px; align-items:flex-end;
          animation:pop .22s ease; }
  @keyframes pop { from { opacity:0; transform:translateY(5px);} to {opacity:1; transform:none;} }
  .turn.start { align-self:flex-start; }   /* Novi: left */
  .turn.end { align-self:flex-end; flex-direction:row-reverse; }  /* user: right */
  .avat { flex:0 0 auto; width:26px; height:26px; border-radius:50%;
          display:flex; align-items:center; justify-content:center; font-size:12px; }
  .turn.start .avat { background:#132a3a; color:var(--green); border:1px solid #1f3a46; }
  .turn.end .avat { background:#12314a; color:var(--accent); border:1px solid #1d3f5c; }
  .turn .box { display:flex; flex-direction:column; gap:3px; }
  .turn.end .box { align-items:flex-end; }
  .who { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  .turn.end .who { color:var(--accent); }
  .turn.start .who { color:var(--green); }
  .bubble { border-radius:12px; padding:9px 13px; font-size:14px; line-height:1.5;
            border:1px solid var(--border); max-width:100%; white-space:pre-wrap; word-break:break-word; }
  .turn.start .bubble { background:var(--novi-bg); border-bottom-left-radius:3px; }
  .turn.end .bubble { background:var(--user-bg); border-bottom-right-radius:3px; }
  .bubble.thinking { display:flex; align-items:center; gap:9px; color:var(--dim); }
  .spinner { width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent);
             border-radius:50%; animation:spin .8s linear infinite; display:inline-block; }
  .turn .trace { font-size:12px; color:#aab6c4; margin-top:6px; }
  .turn .trace b { color:#e7eef7; }
  .turn .trace .row { padding:1px 0; }
  .turn .route { display:inline-block; padding:0 6px; border:1px solid var(--border); border-radius:4px; font-size:11px; color:var(--accent); }

  .chatinput { flex:0 0 auto; border-top:1px solid var(--border); padding:12px 24px 14px;
               background:var(--bg); }
  .chatinput textarea { width:100%; min-height:48px; max-height:160px; background:#0d1118; color:var(--text);
               border:1px solid var(--border); border-radius:10px; padding:10px 12px; font:inherit; resize:none; }
  .chatinput textarea:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:8px; align-items:center; margin-top:8px; }
  button { background:#1a2130; color:var(--text); border:1px solid var(--border); border-radius:8px;
           padding:8px 14px; cursor:pointer; font:inherit; display:inline-flex; align-items:center; gap:7px;
           transition:border-color .15s, color .15s, background .15s, transform .05s; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); background:#1c2536; }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06131f; font-weight:600; }
  button.primary:hover:not(:disabled) { background:#6bd0ff; }
  .muted { color:var(--dim); font-size:12px; }
  input[type=number] { width:70px; background:#0d1118; color:var(--text); border:1px solid var(--border);
                       border-radius:4px; padding:4px; font:inherit; }

  /* ---------- STATE / LOG panels ---------- */
  .layout { display:grid; grid-template-columns:minmax(300px,390px) 1fr; gap:14px;
            padding:14px 20px; height:100%; width:100%; overflow:auto; }
  .panel { background:linear-gradient(180deg, #141a26, #10151f); border:1px solid var(--border);
           border-radius:12px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .panel h2 { margin:0; padding:9px 14px; font-size:11px; text-transform:uppercase; letter-spacing:1.2px;
              color:var(--dim); border-bottom:1px solid var(--border); background:rgba(255,255,255,.015); }
  .panel .body { padding:12px; overflow:auto; }
  .stack { display:flex; flex-direction:column; gap:14px; height:100%; min-height:0; }
  .right { display:grid; grid-template-rows:auto auto 1fr; gap:14px; min-height:0; }
  .kv { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed #1c2230; }
  .kv .k { color:var(--dim); } .kv .v { color:#eaf2fb; text-align:right; max-width:62%; word-break:break-word; }
  .affect { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .affect span { background:#1a2130; border:1px solid var(--border); border-radius:4px; padding:2px 7px; font-size:12px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .actions .group { flex:1 1 100%; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-top:8px; }
  canvas { max-width:100%; }
  #map { width:100%; height:auto; margin-top:8px; background:#0a0e15; border:1px solid var(--border); border-radius:6px; }
  .sparks { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .spark { display:flex; flex-direction:column; gap:2px; }
  .spark label { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  .spark canvas { width:100%; height:34px; background:#0a0e15; border:1px solid var(--border); border-radius:5px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .stat { background:#0d1118; border:1px solid var(--border); border-radius:8px; padding:8px 10px;
          display:flex; flex-direction:column; gap:2px; }
  .stat .k { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  .stat .v { font-size:20px; font-weight:700; color:#eaf2fb; line-height:1.1; }

  .logpage { padding:14px 20px; overflow-y:auto; scrollbar-width:none; width:100%; }
  .logpage::-webkit-scrollbar { display:none; }
  .log { display:flex; flex-direction:column; font-size:12px; }
  .log .ev { padding:4px 10px; border-bottom:1px dashed #182030; display:flex; gap:10px; animation:pop .15s ease; }
  .log .ev .t { color:var(--dim); flex:0 0 70px; }
  .log .ev .e { color:#cfd8e3; white-space:pre-wrap; word-break:break-word; }
  .health-PASS{color:var(--good)} .health-WARN{color:var(--warn)} .health-FAIL{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span><h1>NOVI</h1></div>
  <nav class="nav">
    <button id="tabChat" class="active">Chat</button>
    <button id="tabState">State</button>
    <button id="tabLog">Event Log</button>
  </nav>
  <span class="badge" id="runid">…</span>
  <span class="badge">cycle <b id="cycle">0</b></span>
  <span class="badge" id="health" class="health-PASS">—</span>
  <div class="modelwrap">
    <span class="muted">model</span>
    <select id="modelSelect" title="chat/reasoning model"></select>
  </div>
</header>

<!-- CHAT PAGE -->
<div class="page active" id="page-chat">
  <div class="chatbody" id="chat"></div>
  <div class="chatinput">
    <textarea id="say" placeholder='Ask Novi, e.g. "alice moved the door" …' rows="1"></textarea>
    <div class="row">
      <button id="sendBtn" class="primary">Send</button>
      <button id="listenBtn">🎤 Listen</button>
      <button id="stepBtn">⏭ Step once</button>
      <span class="muted">conf <input type="number" id="conf" value="0.9" step="0.05" min="0" max="1"></span>
    </div>
  </div>
</div>

<!-- STATE PAGE -->
<div class="page" id="page-state">
  <div class="layout">
    <div class="stack">
      <div class="panel"><h2>Reasoning</h2><div class="body" id="reasoning"><span class="muted">awaiting cycle…</span></div></div>
      <div class="panel"><h2>Soul</h2><div class="body" id="soul"><span class="muted">…</span></div></div>
      <div class="panel"><h2>Goals &amp; Plan</h2><div class="body">
        <div id="goals"><span class="muted">…</span></div>
        <canvas id="map" width="340" height="180"></canvas>
      </div></div>
      <div class="panel"><h2>Knowledge &amp; Hearing</h2><div class="body" id="khearing"><span class="muted">…</span></div></div>
      <div class="panel"><h2>Consolidated Memory</h2><div class="body" id="summaries"><span class="muted">no summaries yet</span></div></div>
      <div class="panel"><h2>Recent Narrative</h2><div class="body" id="narrative"><span class="muted">nothing yet</span></div></div>
    </div>
    <div class="right">
      <div class="panel"><h2>Activity</h2><div class="body">
        <div class="stats">
          <div class="stat"><span class="k">cycle</span><span class="v" id="statCycle">0</span></div>
          <div class="stat"><span class="k">health</span><span class="v" id="statHealth">—</span></div>
          <div class="stat"><span class="k">mem</span><span class="v" id="statMem">0</span></div>
          <div class="stat"><span class="k">triples</span><span class="v" id="statTriples">0</span></div>
        </div>
        <div class="sparks">
          <div class="spark"><label>Events / sec</label><canvas id="evSpark" width="560" height="34"></canvas></div>
          <div class="spark"><label>Confidence</label><canvas id="confSpark" width="560" height="34"></canvas></div>
          <div class="spark"><label>Knowledge (triples)</label><canvas id="memSpark" width="560" height="34"></canvas></div>
        </div>
      </div></div>
      <div class="panel"><h2>Actions</h2><div class="body">
        <div class="actions">
          <div class="group">Audio events</div>
          <button data-audio="knock">🔨 Knock</button>
          <button data-audio="alarm">🚨 Alarm</button>
          <button data-audio="footstep">👣 Footstep</button>
          <button data-audio="">✨ Unknown sound</button>
          <div class="group">Goals</div>
          <button data-goal="1,1">Reach (1,1)</button>
          <button data-goal="3,0">Reach (3,0)</button>
          <div class="group">System</div>
          <button id="healthBtn">Health check</button>
        </div>
      </div></div>
    </div>
  </div>
</div>

<!-- EVENT LOG PAGE -->
<div class="page" id="page-log">
  <div class="logpage"><div class="log" id="log"><span class="muted">waiting for events…</span></div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let after = 0, chatAfter = 0;
const confHist = [], memHist = [], evHist = [];

function esc(s){ return String(s==null?'':s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function kv(k,v){ return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
function h(sc) { return '<span class="health-'+sc+'">'+sc+'</span>'; }

// ---- tabs ----
function showPage(name){
  ['chat','state','log'].forEach(p => $('page-'+p).classList.toggle('active', p===name));
  ['Chat','State','Log'].forEach((t,i) => ['tabChat','tabState','tabLog'][i].classList.toggle('active', ['chat','state','log'][i]===name));
  if (name==='state') drawSparks();
}
$('tabChat').onclick = () => showPage('chat');
$('tabState').onclick = () => showPage('state');
$('tabLog').onclick = () => showPage('log');

// ---- model switcher ----
async function loadModels() {
  try {
    const r = await (await fetch('/api/model')).json();
    const sel = $('modelSelect'); sel.innerHTML = '';
    for (const m of (r.available||[])) {
      const o = document.createElement('option'); o.value = m; o.textContent = m;
      if (m === r.current) o.selected = true; sel.appendChild(o);
    }
  } catch(e) {}
}
$('modelSelect').addEventListener('change', async e => {
  await post('/api/model', {model: e.target.value});
  const chat = $('chat');
  chat.appendChild(turnEl('novi', 'switched model → '+esc(e.target.value), null));
  chat.scrollTop = chat.scrollHeight;
});
async function post(path, data) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data||{})});
  return r.json();
}

function turn(role, textHtml, traceHtmlVal) {
  const t = document.createElement('div');
  t.className = 'turn ' + (role==='user' ? 'end' : 'start');
  t.innerHTML = '<div class="avat">'+(role==='user'?'you':'N')+'</div><div class="box">'+
                '<div class="who">'+(role==='user'?'you':'novi')+'</div>'+
                '<div class="bubble">'+textHtml+'</div>'+(traceHtmlVal||'')+'</div>';
  return t;
}

function traceHtml(t) {
  if (!t) return '';
  const route = t.route || 'deterministic';
  let s = '<div class="trace">';
  s += '<div class="row"><b>conclusion:</b> '+esc(t.conclusion)+'</div>';
  s += '<div class="row"><b>confidence:</b> '+(t.confidence||0).toFixed(2)+
       ' &nbsp; <b>route:</b> <span class="route">'+esc(route)+'</span>'+(t.route_reason?' — '+esc(t.route_reason):'')+'</div>';
  s += '<div class="row"><b>action:</b> '+esc(t.action)+'</div>';
  s += '<div class="row"><b>rationale:</b> '+esc(t.rationale||'—')+'</div>';
  s += '<div class="row"><b>recalled:</b> '+(t.recalled||0)+' memories &nbsp; <b>cycle:</b> '+t.cycle+'</div>';
  if (t.detections && t.detections.length) s += '<div class="row"><b>seeing:</b> '+esc(t.detections.join(', '))+'</div>';
  if (t.inferences && t.inferences.length) s += '<div class="row"><b>inferred:</b> '+esc(t.inferences.join(' · '))+'</div>';
  if (t.hypotheses && t.hypotheses.length) s += '<div class="row"><b>hypotheses:</b> '+esc(t.hypotheses.map(h=>h.hypothesis).join(' · '))+'</div>';
  if (t.deliberation && t.deliberation.analysis) s += '<div class="row"><b>deliberation:</b> '+esc(t.deliberation.analysis)+'</div>';
  if (t.deliberation && t.deliberation.decision && t.deliberation.decision.rationale) s += '<div class="row"><b>chose:</b> '+esc(t.deliberation.decision.rationale)+'</div>';
  s += '</div>';
  return s;
}

function putLoading(){
  const c = $('chat');
  if (c.children.length === 0) {
    c.innerHTML = '<div class="empty"><div class="ring">◐</div><p>Novi is awake and listening.<br><span class="muted">say something below to start a conversation.</span></p></div>';
  }
}

async function refreshChat() {
  try {
    const r = await (await fetch('/api/chat?after='+chatAfter)).json();
    chatAfter = r.after;
    if (r.entries && r.entries.length) {
      const chat = $('chat');
      const hadEmpty = chat.firstChild && chat.firstChild.classList.contains('empty');
      for (const it of r.entries) {
        if (it.role === 'user') {
          chat.appendChild(turn('user', esc(it.text)));
        } else {
          chat.appendChild(turn('novi', esc(it.text), traceHtml(it.trace)));
        }
      }
      if (hadEmpty) { const e = chat.querySelector('.empty'); if (e) e.remove(); }
      while (chat.children.length > 90) chat.removeChild(chat.firstChild);
      chat.scrollTop = chat.scrollHeight;
    }
  } catch(e) {}
}

// ---- sparklines ----
function drawSpark(cv, vals, color) {
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  // baseline
  ctx.strokeStyle = '#1a2230'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,H-1); ctx.lineTo(W,H-1); ctx.stroke();
  if (!vals || vals.length === 0) return;
  const n = vals.length;
  const max = Math.max(...vals), min = Math.min(...vals);
  // if the series is flat, center the line instead of pinning it to the bottom
  const span = (max - min) || 1;
  const pad = 4;
  const y = v => H - pad - ((v - min) / span) * (H - pad*2);
  // area fill
  ctx.fillStyle = color + '22';
  ctx.beginPath(); ctx.moveTo(0, H-1);
  for (let i=0;i<n;i++) ctx.lineTo((i/(n-1))*W, y(vals[i]));
  ctx.lineTo(W, H-1); ctx.closePath(); ctx.fill();
  // line
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  for (let i=0;i<n;i++){
    const x = (i/(n-1))*W, yy = y(vals[i]);
    i===0 ? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
  }
  ctx.stroke();
  // end dot
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(W, y(vals[n-1]), 2.5, 0, 2*Math.PI); ctx.fill();
}
function drawSparks(){
  drawSpark($('evSpark'), evHist, '#f2c14e');
  drawSpark($('confSpark'), confHist, '#4cc2ff');
  drawSpark($('memSpark'), memHist, '#3fd07f');
}

// ---- virtual floor map ----
function drawMap(s) {
  const cv = $('map'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = '#1a2230'; ctx.fillStyle = '#0a0e15'; ctx.fillRect(0,0,W,H);
  const world = 10, px = W/world, py = H/6;
  for (let i=1;i<world;i++){ ctx.beginPath(); ctx.moveTo(i*px,0); ctx.lineTo(i*px,H); ctx.stroke(); }
  for (let i=1;i<6;i++){ ctx.beginPath(); ctx.moveTo(0,i*py); ctx.lineTo(W,i*py); ctx.stroke(); }
  ctx.font='9px monospace'; ctx.fillStyle='#5b6b7f';
  ctx.fillText('0',2,H-4); ctx.fillText(world+'m',W-28,H-4); ctx.fillText('6m',2,12);
  const pos = s.body||{}, bx = pos.x_m||0, by = pos.y_m||0;
  const goal = s.active_goal || {};
  let tx=0, ty=0;
  const m = /[(\[]?\s*(-?[\d.]+)\s*,?\s*(-?[\d.]+)/.exec(goal.target||'');
  if (m){ tx=parseFloat(m[1]); ty=parseFloat(m[2]); }
  const cx = v => Math.max(3, Math.min(W-3, v*px));
  const cy = v => Math.max(3, Math.min(H-3, H - v*py));
  ctx.fillStyle='#f2c14e'; ctx.beginPath(); ctx.arc(cx(tx), cy(ty), 6, 0, 2*Math.PI); ctx.fill();
  ctx.fillStyle='#0a0e15'; ctx.font='bold 9px monospace'; ctx.textAlign='center';
  ctx.fillText('G', cx(tx), cy(ty)+3);
  ctx.fillStyle='#3a4657'; ctx.fillRect(cx(0)-1.5, cy(0)-1.5, 3, 3);
  const hdg = (pos.heading_deg!=null? pos.heading_deg : 0) * Math.PI/180;
  const nx=cx(bx), ny=cy(by);
  ctx.fillStyle='#4cc2ff'; ctx.beginPath();
  ctx.moveTo(nx + Math.cos(hdg)*8, ny - Math.sin(hdg)*8);
  ctx.lineTo(nx + Math.cos(hdg+2.4)*5, ny - Math.sin(hdg+2.4)*5);
  ctx.lineTo(nx + Math.cos(hdg-2.4)*5, ny - Math.sin(hdg-2.4)*5);
  ctx.closePath(); ctx.fill();
  ctx.textAlign='left'; ctx.fillStyle='#4cc2ff'; ctx.fillText('novi', nx+8, ny+14);
}

async function refreshState() {
  try {
    const s = await (await fetch('/api/state')).json();
    $('runid').textContent = s.run_id ? s.run_id.slice(0,8) : '—';
    $('cycle').textContent = s.cycle;
    const hth = s.health || {};
    $('health').innerHTML = h(hth.status||'UNKNOWN');
    $('health').className = 'health-'+ (hth.status||'UNKNOWN');
    const rt = s.reasoning_trace || {};
    const ls = s.last_step || {};
    confHist.push(rt.confidence||0); if (confHist.length>60) confHist.shift();
    let rh = '';
    if (rt.conclusion) {
      rh += kv('conclusion', rt.conclusion);
      rh += kv('confidence', (rt.confidence||0).toFixed(2));
      rh += kv('route', rt.route + (rt.route_reason?' · '+rt.route_reason:''));
      rh += kv('action', rt.action);
      rh += kv('rationale', rt.rationale||'—');
      rh += kv('recalled', (rt.recalled||0)+' memories');
      rh += kv('detections', (rt.detections||ls.detections||[]).join(', ') || 'none');
    } else { rh = '<span class="muted">awaiting first cycle…</span>'; }
    $('reasoning').innerHTML = rh;
    const so = s.soul || {};
    let affect = '';
    for (const [k,v] of Object.entries(so.affect||{})) affect += '<span>'+k+':'+v.toFixed(2)+'</span>';
    $('soul').innerHTML = kv('identity', so.identity) + kv('tone', so.tone) + '<div class="affect">'+affect+'</div>';
    let g = '';
    if (s.active_goal) {
      g += kv('active', s.active_goal.kind + ' → ' + s.active_goal.target);
      g += kv('status', s.active_goal.status);
      g += kv('steps', s.active_goal.steps_taken);
      if (s.active_goal.distance_to_goal!=null) g += kv('distance', s.active_goal.distance_to_goal + ' m');
      const plan = s.plan || {};
      if (plan.steps && plan.steps.length) {
        const steps = plan.steps.map(st => st.action + (st.done?' ✓':'')).join(' → ');
        g += '<div class="kv"><span class="k">plan</span><span class="v">'+steps+'</span></div>';
      }
    } else { g += kv('active', 'none'); }
    g += kv('history', (s.goals_history||[]).map(x=>x.kind+':'+x.status).slice(-3).join(' | ') || 'none');
    $('goals').innerHTML = g;
    drawMap(s);
    const kn = s.knowledge || {};
    memHist.push(kn.triples||0); if (memHist.length>60) memHist.shift();
    const hv = (s.hearing||[]).map(e=>e.event_type).join(', ') || 'silence';
    $('khearing').innerHTML = kv('triples', kn.triples) + kv('entities', kn.entities) + kv('contradicted', kn.contradicted)
      + kv('memory.active', s.memory && s.memory.active!=null ? s.memory.active : '—') + kv('heard', hv);
    const sums = (s.memory && s.memory.summaries) || [];
    $('summaries').innerHTML = sums.length
      ? sums.map(x => '<div class="kv"><span class="k">'+esc((x.entity_refs||[]).join(',')||'summary')+'</span><span class="v">'+esc(x.content)+'</span></div>').join('')
      : '<span class="muted">no summaries yet</span>';
    const narr = (s.narrative || []).join(' ');
    $('narrative').innerHTML = narr ? '<div class="kv"><span class="v">'+esc(narr)+'</span></div>' : '<span class="muted">nothing yet</span>';
    // stat cards
    $('statCycle').textContent = s.cycle;
    $('statHealth').textContent = hth.status||'UNKNOWN';
    $('statHealth').className = 'health-'+ (hth.status||'UNKNOWN');
    $('statMem').textContent = (s.memory && s.memory.active!=null) ? s.memory.active : '—';
    $('statTriples').textContent = kn.triples||0;
    drawSparks();
  } catch(e) {}
}

async function refreshEvents() {
  try {
    const r = await (await fetch('/api/events?after='+after)).json();
    after = r.after;
    if (r.events && r.events.length) {
      const log = $('log');
      if (log.firstChild && log.firstChild.textContent.includes('awaiting')) log.innerHTML = '';
      for (const it of r.events) {
        const ev = it.event;
        const line = document.createElement('div'); line.className='ev';
        line.innerHTML = '<span class="t">'+ (ev.cycle!=null?('c'+ev.cycle):'') +'</span>'
                       + '<span class="e">'+ (ev.event_type||'event') +' ' + JSON.stringify(stripJson(ev)).slice(0,180) +'</span>';
        log.appendChild(line);
      }
      while (log.children.length > 500) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
      // feed the Events/sec sparkline (spikes when Novi is active)
      evHist.push(r.events.length); if (evHist.length>60) evHist.shift();
      drawSparks();
    } else {
      evHist.push(0); if (evHist.length>60) evHist.shift();
    }
  } catch(e) {}
}
function stripJson(o){ const c={...o}; delete c.event_type; delete c.cycle; delete c.cycle_id; return c; }

// ---- chat actions ----
function typing(on){
  const c = $('chat');
  if (on) {
    const el = document.createElement('div'); el.id='typing'; el.className='turn start';
    el.innerHTML = '<div class="avat">N</div><div class="box"><div class="who">novi</div><div class="bubble thinking"><span class="spinner"></span> thinking…</div></div>';
    c.appendChild(el);
  } else {
    const t = $('typing'); if (t) t.remove();
  }
  c.scrollTop = c.scrollHeight;
}

$('sendBtn').onclick = async () => {
  const text = $('say').value.trim();
  if (!text) return;
  $('say').value = '';
  $('sendBtn').disabled = true; $('sendBtn').innerHTML = '<span class="spinner"></span> sending';
  typing(true);
  try { await post('/api/chat', {text, confidence: parseFloat($('conf').value)}); }
  catch(e) { $('chat').appendChild(turn('novi', '(reply failed — is the model reachable?)')); }
  typing(false);
  $('sendBtn').disabled = false; $('sendBtn').textContent = 'Send';
  refreshState(); refreshChat();
};
$('say').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('sendBtn').click(); } });
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,160)+'px'; }
$('say').addEventListener('input', e => autoGrow(e.target));

$('listenBtn').onclick = async () => {
  $('listenBtn').disabled = true; typing(true);
  try {
    const r = await post('/api/listen', {});
    if (r.error) throw new Error(r.error);
    if (!r.result || !r.result.heard) $('chat').appendChild(turn('novi', '(nothing heard)'));
  } catch(e) {
    $('chat').appendChild(turn('novi', '(Listen needs real sensing — start with <b>--camera real</b>)'));
  }
  typing(false); $('listenBtn').disabled = false;
  refreshState(); refreshChat();
};
$('stepBtn').onclick = async () => { await post('/api/step'); refreshState(); refreshChat(); };
$('healthBtn').onclick = async () => { await post('/api/health'); refreshState(); };
document.querySelectorAll('[data-audio]').forEach(b => b.onclick = async () => {
  const hint = b.getAttribute('data-audio');
  const r = await post('/api/audio', {event_hint: hint||null, rms: 0.7, novelty: hint?0:0.9, confidence: 0.9});
  refreshState();
});
document.querySelectorAll('[data-goal]').forEach(b => b.onclick = async () => {
  const [x,y] = b.getAttribute('data-goal').split(',').map(Number);
  await post('/api/goal', {x, y, max_steps: 60});
  refreshState();
});

putLoading($('chat'));
setInterval(refreshState, 1000);
setInterval(refreshEvents, 1000);
setInterval(refreshChat, 1200);
refreshState(); refreshEvents(); refreshChat(); loadModels();
</script>
