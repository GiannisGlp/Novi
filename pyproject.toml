[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novi"
version = "0.1.0"
description = "Novi — persistent autonomous embodied AI system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Novi Project"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Core (always required — stdlib only, no installs needed)
# Listed here for documentation purposes
core = []

# Real neural perception (Torchvision SSDLite on MPS, Whisper STT)
neural = [
    "torch>=2.0",
    "torchvision>=0.15",
    "faster-whisper>=1.0",
]

# NVIDIA LocateAnything spatial grounding (plan LOCATE_ANYTHING_IMPLEMENTATION_PLAN_2026-08-28).
# Isolated behind an optional extra — never part of the core install. The
# model itself (~7.8 GB, pinned revision) is NOT included; download separately
# via scripts/mac-locateanything-env.sh. Non-commercial research/evaluation
# license; see docs/07-locate-anything/06_ARCHITECTURE_DECISION.md.
locateanything = [
    "torch>=2.2",
    "transformers>=4.46",
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "peft>=0.12",
    "timm>=1.0",
    "pillow>=10.0",
]

# Mac audio I/O
audio = [
    "sounddevice>=0.4",
]

# Mac camera (optional — deterministic fallback works without it)
vision = [
    "opencv-python>=4.8",
]

# Local LLM via Ollama (qwen, nemotron)
llm = [
    # Ollama runs as a separate service; the Python side uses urllib (stdlib)
    # Listed here for documentation purposes
]

# Semantic embeddings (local, offline)
embeddings = [
    "sentence-transformers>=2.2",
    "torch>=2.0",  # for MPS acceleration on Apple Silicon
]

# Knowledge-graph analytics (multi-hop query, pagerank); pure-python
# fallbacks exist in kgraph.py when absent
graph = [
    "networkx>=3.0",
]

# Development and testing
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "jsonschema>=4.23,<5",
]

# Typed cognition contract layer (docs/03-cognition/22, 25, 26 + gap-analysis Step 1)
typed = [
    "pydantic>=2.7",
]

# Units + measurement-uncertainty propagation (spatial model, fusion engine)
metrology = [
    "pint>=0.25",
    "uncertainties>=3.2",
]

# Discrete-event simulation of the closed-loop runtime (closed-loop parity)
simulation = [
    "simpy>=4.1",
]

# Everything for a full Brain setup (mac kept as alias for backward compat)
brain = [
    "novi[neural,audio,vision,llm,typed,metrology,simulation,embeddings,dev]",
]
mac = [
    "novi[brain]",
]


[project.scripts]
novi-brain = "novi.brain.cli:main"
novi-web = "novi.web.server:main"
brain-cli = "novi.brain.cli:main"

[tool.setuptools.packages.find]
include = ["novi*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["novi/brain/tests", "novi/brain/inference/tests", "novi/web/tests", "novi/contracts/tests", "novi/cognition/tests", "training/tests"]
pythonpath = ["."]
addopts = "-v --tb=short"